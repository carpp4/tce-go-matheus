<script type="application/json" id="questionData">[{"id":"q1","subject":"s1","group":"gerais","stem":"Assinale a frase com emprego correto de crase.","options":["O documento foi enviado à todos.","A reunião ocorreu à partir das dez.","Os autos foram encaminhados à um setor.","Ela escreveu à lápis.","O servidor dirigiu-se à comissão."],"answer":4,"explanation":"A crase resulta da fusão da preposição a com artigo feminino a: dirigir-se a + a comissão."},{"id":"q2","subject":"s1","group":"gerais","stem":"Qual frase está de acordo com a concordância verbal da norma-padrão?","options":["Houveram várias reuniões ontem.","Fazem três meses que o processo começou.","Existe muitas dúvidas no relatório.","Aconteceu dois problemas no setor.","Faz três meses que o processo começou."],"answer":4,"explanation":"O verbo fazer indicando tempo transcorrido é impessoal e permanece na 3ª pessoa do singular."},{"id":"q3","subject":"s1","group":"gerais","stem":"Considerando o sentido de assistir como presenciar, a regência correta é:","options":["Os técnicos assistiram o julgamento.","Os técnicos assistiram ao julgamento.","Os técnicos assistiram no julgamento.","Os técnicos assistiram pelo julgamento.","Os técnicos assistiram de julgamento."],"answer":1,"explanation":"No sentido de ver ou presenciar, assistir exige a preposição a: assistir a algo."},{"id":"q4","subject":"s1","group":"gerais","stem":"Em “A cidade despertou com a notícia”, atribui-se ação humana à cidade. Essa figura de linguagem é:","options":["Metonímia.","Eufemismo.","Hipérbole.","Antítese.","Personificação."],"answer":4,"explanation":"Personificação (prosopopeia) atribui ações ou características humanas a seres inanimados."},{"id":"q5","subject":"s1","group":"gerais","stem":"Na oração “O relatório que analisei foi aprovado”, o termo “que” funciona como:","options":["Advérbio de intensidade.","Preposição essencial.","Pronome relativo.","Conjunção integrante.","Artigo definido."],"answer":2,"explanation":"O “que” retoma al e habitual.","Sempre com duplo sentido."],"answer":3,"explanation":"Denotação corresponde ao sentido literal, em oposição à conotação figurada."},{"id":"q11","subject":"s2","group":"gerais","stem":"Quanto é 40% de 250?","options":["75","110","125","90","100"],"answer":4,"explanation":"0,40 × 250 = 100."},{"id":"q12","subject":"s2","group":"gerais","stem":"Qual é o resultado de 3/4 + 1/8?","options":["7/8","1/2","4/12","5/8","1"],"answer":0,"explanation":"3/4 = 6/8, então 6/8 + 1/8 = 7/8."},{"id":"q13","subject":"s2","group":"gerais","stem":"Um item de R$ 500 recebe aumento de 10% e depois desconto de 10%. Preço final:","options":["R$ 500,00","R$ 505,00","R$ 495,00","R$ 450,00","R$ 490,00"],"answer":2,"explanation":"500 × 1,10 × 0,90 = 495; percentuais sucessivos não se anulam."},{"id":"q14","subject":"s2","group":"gerais","stem":"Se 6 servidores analisam 12 processos em 4 horas, mantendo produtividade igual, quantos analisam 3 servidores em 4 horas?","options":["24 processos","3 processos","6 processos","9 processos","12 processos"],"answer":2,"explanation":"Metade dos servidores, mesmo tempo e mesma produtividade: metade dos processos."},{"id":"q15","subject":"s2","group":"gerais","stem":"Premissas: todos os auditores são servidores; Maria é auditora. Conclusão necessária:","options":["Maria é servidora.","Todos os servidores são Maria.","Maria é a única auditora.","Todos os servidores são auditores.","Nenhum auditor é servidor."],"answer":0,"explanation":"Da inclusão dos auditores no conjunto dos servidores, conclui-se que Maria pertence ao conjunto dos servidores."},{"id":"q16","subject":"s2","group":"gerais","stem":"Qual o próximo termo da sequência 2, 6, 12, 20, 30, ...?","options":["42","40","48","44","36"],"answer":0,"explanation":"As diferenças são 4, 6, 8, 10; a seguinte é 12. Logo, 30+12=42."},{"id":"q17","subject":"s2","group":"gerais","stem":"Se P implica Q, e P é verdadeira, qual conclusão segue validamente?","options":["Q é verdadeira.","Nada pode ser concluído sobre Q.","Q é falsa.","P é falsa.","P e Q são sempre falsas."],"answer":0,"explanation":"Trata-se de modus ponens: P → Q e P permitem concluir Q."},{"id":"q18","subject":"s2","group":"gerais","stem":"Uma turma tem homens e mulheres na razão 3:5, totalizando 64 pessoas. Quantos homens há?","options":["30","24","40","21","18"],"answer":1,"explanation":"Há 8 partes: 64/8=8; homens =3×8=24."},{"id":"q19","subject":"s2","group":"gerais","stem":"Uma urna contém 3 bolas vermelhas e 2 azuis. Probabilidade de retirar uma vermelha em um sorteio:","options":["2/5","3/2","3/5","1/5","1/2"],"answer":2,"explanation":"Há 3 resultados favoráveis entre 5 igualmente prováveis."},{"id":"q20","subject":"s3","group":"gerais","stem":"Entre os princípios expressos no art. 37, caput, da Constituição, encontra-se:","options":["Sigilo como regra.","Pessoalidade.","Publicidade.","Vitaliciedade administrativa.","Partidarismo."],"answer":2,"explanation":"Os princípios expressos são legalidade, impessoalidade, moralidade, publicidade e eficiência."},{"id":"q21","subject":"s3","group":"gerais","stem":"Segundo a CF, a fiscalização contábil, financeira e orçamentária da União é exercida pelo Congresso Nacional, mediante:","options":["Controle exclusivo do Poder Judiciário.","Controle externo, e pelo sistema de controle interno de cada Poder.","Fiscalização apenas pelos municípios.","Controle externo somente do Ministério Público.","Controle exclusivamente privado."],"answer":1,"explanation":"O art. 70 prevê controle externo pelo Congresso e interno por cada Poder."},{"id":"q22","subject":"s3","group":"gerais","stem":"No âmbito da União, o Tribunal de Contas da União exerce sua função constitucional como órgão que:","options":["Formula leis federais.","Substitui o Congresso em todas as deliberações.","Integra o Poder Judiciário.","Auxilia o Congresso Nacional no controle externo.","Exerce o Poder Executivo."],"answer":3,"explanation":"O TCU auxilia o Legislativo no controle externo, com competências constitucionais próprias."},{"id":"q23","subject":"s3","group":"gerais","stem":"A Lei Estadual nº 16.168/2007 de Goiás corresponde à:","options":["Lei Orgânica do Tribunal de Contas do Estado de Goiás.","Lei de Responsabilidade Fiscal federal.","Lei de Diretrizes Orçamentárias da União.","Constituição da República.","Lei federal de Licitações."],"answer":0,"explanation":"A Lei Estadual 16.168/2007 dispõe sobre a Lei Orgânica do TCE-GO."},{"id":"q24","subject":"s3","group":"gerais","stem":"A Resolução nº 22/2008, mencionada no programa do concurso, trata do:","options":["Regimento Interno do TCE-GO.","Código Penal brasileiro.","Código de Processo Civil.","Plano Plurianual federal.","Regulamento do TCU."],"answer":0,"explanation":"A Resolução 22/2008 é a base do Regimento Interno do TCE-GO, sujeito a alterações posteriores."},{"id":"q25","subject":"s3","group":"gerais","stem":"O regime jurídico dos servidores públicos civis de Goiás é disciplinado, entre outras normas, pela:","options":["Lei nº 4.320/1964.","Lei nº 13.105/2015.","Lei Complementar nº 101/2000.","Lei Federal nº 8.666/1993.","Lei Estadual nº 20.756/2020."],"answer":4,"explanation":"A Lei Estadual 20.756/2020 é a legislação estatutária indicada no edital."},{"id":"q26","subject":"s4","group":"especificos","stem":"A presunção de legitimidade dos atos administrativos significa que eles:","options":["São necessariamente irrevogáveis.","Dispensam fundamento legal em toda hipótese.","Nunca podem ser questionados judicialmente.","Produzem efeitos apenas após sentença judicial.","Presumem-se válidos até prova em contrário."],"answer":4,"explanation":"É presunção relativa (juris tantum), não absoluta."},{"id":"q27","subject":"s4","group":"especificos","stem":"A anulação de ato administrativo é cabível, em regra, quando houver:","options":["Preferência política abstrata.","Desagrado de terceiros sem ilegalidade.","Mudança de gestor, sem outra razão.","Simples inconveniência, mesmo sem vício.","Ilegalidade."],"answer":4,"explanation":"Anulação corrige ilegalidade; revogação se relaciona a conveniência/oportunidade de atos válidos."},{"id":"q28","subject":"s4","group":"especificos","stem":"O deslocamento de atribuições de um órgão para outro dentro da mesma pessoa jurídica denomina-se:","options":["Privatização.","Terceirização obrigatória.","Descentralização por serviço.","Desconcentração.","Concessão de serviço público."],"answer":3,"explanation":"Desconcentração distribui competências entre órgãos da mesma pessoa jurídica."},{"id":"q29","subject":"s4","group":"especificos","stem":"A responsabilidade civil objetiva do Estado por dano causado por agente nessa qualidade decorre, em regra, da teoria do:","options":["Enriquecimento sem causa.","Dolo obrigatório do agente.","Risco administrativo.","Risco integral em toda situação.","Inexistência de nexo causal."],"answer":2,"explanation":"O art. 37, §6º, da CF adota, em regra, o risco administrativo, com necessidade de dano e nexo causal."},{"id":"q30","subject":"s5","group":"especificos","stem":"Na Lei 14.133/2021, o pregão é modalidade usada tipicamente para:","options":["Concurso público para cargos efetivos.","Alienação de imóveis públicos em qualquer situação.","Aquisição de bens e serviços comuns.","Escolha de trabalho artístico exclusivamente.","Contratação de parceria público-privada necessariamente."],"answer":2,"explanation":"O pregão visa bens e serviços comuns, cujos padrões podem ser objetivamente definidos."},{"id":"q31","subject":"s5","group":"especificos","stem":"Na contratação direta, a inexigibilidade caracteriza-se, essencialmente, por:","options":["Ausência de planejamento em qualquer contratação.","Baixo valor obrigatório em todo caso.","Exigência de haver cinco fornecedores habilitados.","Necessidade de sorteio público.","Inviabilidade de competição."],"answer":4,"explanation":"A inexigibilidade decorre da inviabilidade de competição, com hipóteses e requisitos legais."},{"id":"q32","subject":"s5","group":"especificos","stem":"O PNCP previsto na Lei nº 14.133/2021 é:","options":["Sistema exclusivo de folha de pagamento.","Uma modalidade de licitação.","Cadastro de pessoas naturais condenadas criminalmente.","Portal nacional de divulgação de atos e informações das contratações.","Órgão julgador ligado ao STF."],"answer":3,"explanation":"O Portal Nacional de Contratações Públicas centraliza publicidade de informações e documentos."},{"id":"q33","subject":"s5","group":"especificos","stem":"O sistema de registro de preços serve, em termos gerais, para:","options":["Obrigar o órgão a adquirir toda quantidade estimada.","Transformar compras comuns em concurso de provas.","Registrar preços e condições para contratações futuras.","Substituir toda fiscalização contratual.","Dispensar pesquisa e planejamento."],"answer":2,"explanation":"A ata permite contratações futuras, sem obrigação automática de adquirir a quantidade registrada."},{"id":"q34","subject":"s6","group":"especificos","stem":"A Constituição brasileira de 1988 é classificada, quanto à alterabilidade, como:","options":["Costumeira.","Rígida.","Flexível.","Imutável.","Semirrígida na classificação predominante."],"answer":1,"explanation":"A alteração exige procedimento mais rigoroso do que a aprovação de leis ordinárias."},{"id":"q35","subject":"s6","group":"especificos","stem":"As normas constitucionais de eficácia plena, em regra:","options":["Dependem sempre de lei integrativa para eficácia.","Produzem seus efeitos essenciais desde a entrada em vigor.","Não têm qualquer força jurídica.","Podem ser aplicadas apenas após decreto presidencial.","São apenas conselhos políticos."],"answer":1,"explanation":"Normas de eficácia plena têm aplicabilidade imediata, direta e integral."},{"id":"q36","subject":"s6","group":"especificos","stem":"É direito individual assegurado pelo art. 5º da Constituição:","options":["Suspensão ilimitada do habeas corpus.","Prisão civil por qualquer dívida comercial.","Liberdade de manifestação do pensamento, vedado o anonimato.","Censura prévia geral a opiniões.","Proibição absoluta de associação lícita."],"answer":2,"explanation":"A CF garante manifestação do pensamento, vedado o anonimato (art. 5º, IV)."},{"id":"q37","subject":"s6","group":"especificos","stem":"A fiscalização pelo controle externo no plano federal está a cargo do:","options":["Conselho Nacional de Justiça exclusivamente.","Ministério Público Federal exclusivamente.","Congresso Nacional, com auxílio do TCU.","Banco Central exclusivamente.","Supremo Tribunal Federal, com auxílio dos municípios."],"answer":2,"explanation":"A CF, arts. 70 e 71, atribui o controle externo ao Congresso Nacional com auxílio do TCU."},{"id":"q38","subject":"s7","group":"especificos","stem":"Uma auditoria que examina economia, eficiência e efetividade de um programa é tipicamente:","options":["Arbitragem privada.","Disciplinar policial.","Inquérito parlamentar automático.","Operacional.","Exclusivamente contábil de lançamento."],"answer":3,"explanation":"Auditoria operacional avalia desempenho e resultados de políticas, programas e ações."},{"id":"q39","subject":"s7","group":"especificos","stem":"Um achado de auditoria é estruturado, frequentemente, a partir de:","options":["Opiniões partidárias da equipe.","Somente o nome da unidade auditada.","Condição, critério, causa e efeito.","Impressões sem documentação.","Ordem cronológica das reuniões."],"answer":2,"explanation":"A estrutura condição–critério–causa–efeito ajuda a sustentar o achado."},{"id":"q40","subject":"s7","group":"especificos","stem":"Ao definir prioridades considerando probabilidade e impacto, a equipe está aplicando:","options":["Dispensa de controle interno.","Prorrogação de prazo automática.","Apenas sorteio aleatório.","Análise de riscos.","Revisão bibliográfica sem critério."],"answer":3,"explanation":"Risco costuma ser avaliado por chance de ocorrência e consequência."},{"id":"q41","subject":"s7","group":"especificos","stem":"Na fase de monitoramento da auditoria, procura-se verificar:","options":["O encerramento obrigatório de qualquer processo.","A eliminação de toda documentação.","Cumprimento de determinações e recomendações.","Se o auditor memorizou o relatório.","Somente a publicação inicial do edital."],"answer":2,"explanation":"Monitoramento acompanha as providências adotadas e os resultados das recomendações."},{"id":"q42","subject":"s8","group":"especificos","stem":"O Plano Plurianual (PPA) estabelece principalmente:","options":["Diretrizes, objetivos e metas de médio prazo da administração pública.","Exclusivamente os créditos suplementares.","Somente execução diária do caixa.","A relação de servidores da semana.","A agenda de sessões legislativas do mês."],"answer":0,"explanation":"O PPA disciplina planejamento de médio prazo, com vigência de quatro exercícios no modelo federal."},{"id":"q43","subject":"s8","group":"especificos","stem":"A Lei de Diretrizes Orçamentárias (LDO) serve, entre outras finalidades, para:","options":["Substituir permanentemente a Constituição.","Julgar contas de gestores municipais.","Definir a pena de todos os crimes financeiros.","Orientar a elaboração da Lei Orçamentária Anual.","Executar pagamentos sem dotação."],"answer":3,"explanation":"A LDO conecta o planejamento do PPA à LOA, fixando prioridades e diretrizes."},{"id":"q44","subject":"s8","group":"especificos","stem":"São estágios clássicos de execução da despesa orçamentária, nesta ordem:","options":["Empenho, liquidação e pagamento.","Pagamento, liquidação e empenho.","Arrecadação, lançamento e empenho.","Empenho, arrecadação e previsão.","Liquidação, pagamento e previsão."],"answer":0,"explanation":"A Lei 4.320/1964 disciplina empenho, liquidação e pagamento da despesa."},{"id":"q45","subject":"s8","group":"especificos","stem":"Despesas empenhadas mas não pagas até 31 de dezembro são chamadas de:","options":["Restos a pagar.","Dívida ativa tributária.","Receitas de capital.","Despesas canceladas definitivamente.","Superávit financeiro automaticamente."],"answer":0,"explanation":"Restos a pagar são despesas empenhadas e não pagas até o encerramento do exercício."},{"id":"q46","subject":"s8","group":"especificos","stem":"A LOA, no sistema orçamentário, corresponde a:","options":["Plano de cargos e salários.","Lei que estima receita e fixa despesa para o exercício.","Ato de controle administrativo sem previsão de despesas.","Norma que extingue o PPA.","Relatório exclusivo de auditoria operacional."],"answer":1,"explanation":"A LOA estima as receitas e fixa as despesas, nos termos constitucionais."},{"id":"q47","subject":"s9","group":"especificos","stem":"O PCASP padroniza principalmente:","options":["O prazo de inscrição dos concursos.","A estrutura de contas contábeis utilizada no setor público.","O preço de cada bem privado.","O código eleitoral de cada município.","Os critérios de seleção de servidores."],"answer":1,"explanation":"O Plano de Contas Aplicado ao Setor Público visa uniformizar registros e permitir consolidação."},{"id":"q48","subject":"s9","group":"especificos","stem":"No regime de competência patrimonial, o reconhecimento de uma variação patrimonial aumentativa ocorre, em regra:","options":["Nunca antes do pagamento da despesa.","Somente quando o valor entra no banco, em qualquer situação.","Após aprovação do Tribunal de Contas.","Quando ocorre o fato gerador, independentemente do recebimento de caixa.","Sempre no fim do mandato do gestor."],"answer":3,"explanation":"O enfoque patrimonial usa competência e não se limita ao recebimento ou pagamento."},{"id":"q49","subject":"s9","group":"especificos","stem":"O MCASP 11ª edição é referência para:","options":["Procedimentos contábeis orçamentários e patrimoniais do setor público.","Regras de trânsito terrestre.","Processo de seleção do legislativo.","Normas de propaganda eleitoral.","Regulamento exclusivamente bancário privado."],"answer":0,"explanation":"O Manual de Contabilidade Aplicada ao Setor Público orienta registros e demonstrações públicas."},{"id":"q50","subject":"s9","group":"especificos","stem":"O Balanço Orçamentário evidencia, entre outras informações:","options":["Somente a variação do número de servidores.","Exclusivamente a folha de pessoal futura.","A votação de leis não orçamentárias.","Somente o patrimônio de acionistas privados.","Receitas previstas e realizadas e despesas fixadas e executadas."],"answer":4,"explanation":"O Balanço Orçamentário confronta previsão/realização das receitas e fixação/execução das despesas."},{"id":"q51","subject":"s10","group":"especificos","stem":"Conseguir alcançar um objetivo planejado é característica principalmente de:","options":["Eficácia.","Eficiência obrigatoriamente.","Alienação patrimonial.","Economicidade em qualquer hipótese.","Descentralização territorial."],"answer":0,"explanation":"Eficácia é atingir objetivos; eficiência relaciona recursos consumidos ao resultado."},{"id":"q52","subject":"s10","group":"especificos","stem":"A análise dos efeitos reais de uma política na sociedade avalia sua:","options":["Impersonalidade do processo.","Efetividade.","Departamentalização.","Centralização.","Hierarquia."],"answer":1,"explanation":"Efetividade refere-se ao impacto social/resultado concreto produzido."},{"id":"q53","subject":"s10","group":"especificos","stem":"O Balanced Scorecard é uma ferramenta de:","options":["Tradução da estratégia em objetivos e indicadores.","Licitação pela modalidade leilão.","Eliminação de indicadores não financeiros.","Controle apenas de ponto dos funcionários.","Sorteio de prioridades de investimento."],"answer":0,"explanation":"BSC conecta objetivos, indicadores, metas e iniciativas em perspectivas estratégicas."},{"id":"q54","subject":"s10","group":"especificos","stem":"A função administrativa de controle envolve:","options":["Comparar desempenho com padrões e corrigir desvios.","Ignorar resultados alcançados.","Apenas definir missão e visão.","Somente contratar pessoas.","Substituir planejamento por improviso."],"answer":0,"explanation":"Controle verifica execução versus metas e promove ajustes."},{"id":"q55","subject":"s11","group":"especificos","stem":"A Administração Científica de Frederick Taylor enfatizava principalmente:","options":["Racionalização de tarefas e métodos de trabalho.","Apenas cultura organizacional informal.","Sorteio de processos de fabricação.","Exclusivamente análise política externa.","Abolição de qualquer padrão produtivo."],"answer":0,"explanation":"Taylor focou estudo de tempos, métodos e produtividade do trabalho."},{"id":"q56","subject":"s11","group":"especificos","stem":"Entre as funções clássicas do administrador encontra-se:","options":["Realizar perícias judiciais obrigatoriamente.","Expedir decisões jurisdicionais.","Julgar crimes.","Planejar.","Legislar."],"answer":3,"explanation":"As funções administrativas clássicas incluem planejar, organizar, dirigir e controlar."},{"id":"q57","subject":"s11","group":"especificos","stem":"A descentralização decisória na gestão tende a:","options":["Proibir delegação.","Eliminar responsabilidades gerenciais.","Distribuir autonomia de decisão por níveis ou unidades.","Extinguir controles internos.","Concentrar toda decisão apenas no topo."],"answer":2,"explanation":"Descentralização significa maior dispersão de poder decisório."},{"id":"q58","subject":"s11","group":"especificos","stem":"A departamentalização funcional agrupa pessoas com base em:","options":["Local de nascimento de cada funcionário.","Período de férias obrigatoriamente.","Sorteio mensal compulsório.","Somente ordem alfabética dos nomes.","Funções ou especialidades semelhantes."],"answer":4,"explanation":"Departamentos podem ser agrupados por função: finanças, RH, produção etc."},{"id":"q59","subject":"s12","group":"especificos","stem":"Na análise SWOT, forças e fraquezas são fatores:","options":["Exclusivamente econômicos externos.","Internos à organização.","Definidos apenas pelos clientes.","Que não podem ser analisados.","Sempre imprevisíveis e externos."],"answer":1,"explanation":"Strengths e Weaknesses representam ambiente interno; Opportunities e Threats, externo."},{"id":"q60","subject":"s12","group":"especificos","stem":"Uma das perspectivas tradicionais do Balanced Scorecard é:","options":["Processos internos.","Natureza penal da conduta.","Somente partido político.","Hierarquia de leis.","Zona eleitoral."],"answer":0,"explanation":"O BSC clássico considera finanças, clientes, processos internos e aprendizado/crescimento."},{"id":"q61","subject":"s12","group":"especificos","stem":"A declaração que descreve o propósito atual de existir da organização é sua:","options":["Auditoria financeira.","Cadeia de comando.","Análise de ameaças.","Visão futura.","Missão."],"answer":4,"explanation":"Missão expressa razão de existir; visão aponta situação futura desejada."},{"id":"q62","subject":"s12","group":"especificos","stem":"Na abordagem de Michael Porter, a cadeia de valor distingue atividades:","options":["Apenas individuais e familiares.","Primárias e de apoio.","Exclusivamente de curto e longo prazo.","Apenas de natureza tributária.","Somente legais e ilegais."],"answer":1,"explanation":"Atividades primárias e de apoio contribuem para a criação de valor e vantagem competitiva."},{"id":"q63","subject":"s13","group":"especificos","stem":"A cultura organizacional representa principalmente:","options":["Apenas o orçamento anual aprovado.","Valores, crenças e pressupostos compartilhados.","Exclusivamente o organograma formal.","Somente a temperatura do ambiente.","A lista de aniversários dos colaboradores."],"answer":1,"explanation":"Cultura abrange pressupostos, valores e padrões duradouros."},{"id":"q64","subject":"s13","group":"especificos","stem":"O clima organizacional costuma captar:","options":["O lucro bruto trimestral.","Percepções dos trabalhadores sobre o ambiente de trabalho.","A quantidade de processos concluídos.","Somente a arquitetura do prédio.","Apenas as regras constitucionais."],"answer":1,"explanation":"Clima traduz como as pessoas percebem e vivenciam o ambiente organizacional."},{"id":"q65","subject":"s13","group":"especificos","stem":"Na comunicação, escuta ativa envolve:","options":["Atenção genuína e verificação do entendimento da mensagem.","Interromper todas as falas do interlocutor.","Responder sem ouvir o contexto.","Ignorar sinais não verbais.","Bloquear perguntas de esclarecimento."],"answer":0,"explanation":"Escuta ativa envolve ouvir atentamente, esclarecer e demonstrar compreensão."},{"id":"q66","subject":"s13","group":"especificos","stem":"Em uma negociação cooperativa, busca-se preferencialmente:","options":["Romper a comunicação imediatamente.","Impor conflito como objetivo final.","Soluções que contemplem interesses das partes.","Vencer a qualquer custo sem diálogo.","Ocultar todos os interesses comuns."],"answer":2,"explanation":"A negociação integrativa visa ganhos mútuos e construção de alternativas."},{"id":"q67","subject":"s14","group":"especificos","stem":"Recrutamento interno caracteriza-se por:","options":["Buscar exclusivamente profissionais de outros países.","Ignorar empregados que queiram promoção.","Impedir movimentação entre unidades.","Contratar sempre por concurso público novo.","Buscar candidatos que já integram a organização."],"answer":4,"explanation":"O recrutamento interno aproveita o quadro atual e pode favorecer mobilidade e retenção."},{"id":"q68","subject":"s14","group":"especificos","stem":"A avaliação de desempenho 360 graus reúne percepções de:","options":["Somente avaliações de anos anteriores.","Apenas da chefia máxima.","Exclusivamente do órgão de controle.","Diversas fontes, como liderança, colegas, subordinados e autoavaliação.","Somente de um cliente escolhido por sorteio."],"answer":3,"explanation":"A avaliação 360° integra diferentes perspectivas sobre comportamentos e competências."},{"id":"q69","subject":"s14","group":"especificos","stem":"O processo de integração de novos profissionais à organização é chamado também de:","options":["Benchmarking externo.","Onboarding.","Outsourcing compulsório.","Downsizing.","Brainstorming de riscos."],"answer":1,"explanation":"Onboarding é o acolhimento, apresentação de processos e integração do novo profissional."},{"id":"q70","subject":"s14","group":"especificos","stem":"Na gestão por competências, normalmente se articulam:","options":["Número de edifícios e computadores.","Apenas missão e visão.","Exclusivamente orçamento e receitas.","Conhecimentos, habilidades e atitudes.","Somente idade e cargo."],"answer":3,"explanation":"O modelo CHA combina conhecimentos, habilidades e atitudes relevantes para o desempenho."}]</script>

function renderEssay(){const e=essays.find(x=>x.id===essaySelected)||essays[0],v=(state.essayDrafts||{})[e.id]||'';$('#app').innerHTML=section('Redação: construir e argumentar.','A prova discursiva de Técnico Administrativo exige treino de texto, além das 70 questões objetivas.','ESCRITA · TREINO AUTORAL',`<span class="badge bgyellow">Proposta de treino · não oficial</span>`)+`<div class="cols"><div><div class="card pad"><div class="boxhead"><h3>Proposta de redação</h3><span class="badge bgblue">Treino livre</span></div><label class="barlabel">TEMA</label><select id="essayTheme" class="field" style="width:100%;margin:10px 0 18px">${essays.map(t=>`<option value="${t.id}" ${t.id===e.id?'selected':''}>${esc(t.topic)}</option>`).join('')}</select><div class="note"><strong>${esc(e.topic)}</strong><br/>${esc(e.prompt)}<br/><br/><small>Ideias para considerar: ${esc(e.points)}.</small></div><label class="barlabel" for="essayEditor" style="display:block;margin:19px 0 9px">SEU TEXTO</label><textarea id="essayEditor" class="field" style="width:100%;min-height:360px;resize:vertical;line-height:1.9" placeholder="Comece com uma introdução e sua tese. Desenvolva argumentos e conclua com uma proposta ou síntese...">${esc(v)}</textarea><div class="row"><span class="hintline" id="essayWords">${words(v)} palavras · salvo automaticamente neste navegador</span><button class="btn outline sm" data-act="exportEssay">↓ Baixar redação</button></div></div></div><div><div class="card pad"><div class="boxhead"><h3>Checklist da redação</h3></div><p class="hintline">Use como autoavaliação inicial. Os critérios oficiais são aqueles do edital da FCC.</p><div class="tasks">${['Minha introdução apresenta tema e tese clara.','Desenvolvi argumentos objetivos e conectados à tese.','Usei exemplos ou fundamentos pertinentes.','Há coesão entre parágrafos e conectivos adequados.','Revisei gramática, pontuação e concordância.','A conclusão retoma a discussão sem contradição.'].map(t=>`<label class="task" style="cursor:pointer"><input type="checkbox"/> <span class="txt"><b style="font-weight:600">${esc(t)}</b></span></label>`).join('')}</div><div class="note" style="margin-top:18px"><strong>Como receber correção minha?</strong><br/>Clique em “Copiar para correção” e cole o texto numa conversa comigo. Posso analisar argumentação, organização, clareza e português; essa correção não equivale à avaliação oficial FCC.</div><button class="btn primary" data-act="copyEssay" style="margin-top:14px;width:100%">▧ Copiar para correção</button></div></div></div>`;}
function renderReview(){const due=dueReviews(),up=Object.entries(state.reviews).filter(([id,r])=>r.due>localDay()).sort((a,b)=>a[1].due.localeCompare(b[1].due));$('#app').innerHTML=section('Revisões espaçadas.','Revisões de curto e médio prazo para consolidar o que você estudou.','REVISÕES',`<span class="badge bgyellow">${due.length} para fazer agora</span>`)+`<div class="cols"><div><div class="card pad"><div class="boxhead"><h3>Para revisar agora</h3><span class="badge bggray">${due.length} pendências</span></div>${due.length?due.map(x=>`<div class="task" style="margin-bottom:9px"><div class="circlestatus">↻</div><div class="txt"><b>${esc(x.topic.name)}</b><small>${esc(x.s.name)} · prazo ${formatDay(x.review.due)}</small></div><button class="btn sm primary" data-act="reviewDone" data-tid="${x.tid}">Revisei ✓</button></div>`).join(''):`<div class="empty">🎉 <strong>Tudo em dia!</strong>Conclua assuntos no edital para que revisões sejam agendadas automaticamente.</div>`}</div></div><div><div class="card pad"><div class="boxhead"><h3>Próximas revisões</h3></div>${up.length?up.slice(0,15).map(([id,r])=>`<div class="trackrow"><div class="number">↻</div><div><b>${esc(getTopic(id)?.name||id)}</b><small>${esc(subjectOfTopic(id)?.name||'')} · ${formatDay(r.due)}</small></div></div>`).join(''):'<p class="hintline">Nenhuma revisão futura agendada.</p>'}<p class="hintline" style="margin-top:15px">Modelo simples de intervalos: 1, 7, 21 e 30 dias. Marque a revisão após ler suas anotações ou refazer questões.</p></div></div></div>`;}
function missedQuestions(){let last={};for(let a of state.attempts)last[a.qid]=a;return Object.values(last).filter(a=>!a.correct).map(a=>({...a,question:bank.find(q=>q.id===a.qid)})).filter(a=>a.question)}
function renderMistakes(){const errs=missedQuestions();$('#app').innerHTML=section('Seu caderno de erros.','A melhor parte de errar é saber exatamente o que precisa voltar a estudar.','REVISÃO ATIVA',`<span class="badge bgred">${errs.length} questões para refazer</span>`)+`<div class="card pad"><div class="boxhead"><h3>Questões com último resultado incorreto</h3><button data-act="trainMistakes" class="btn primary sm" ${errs.length?'':'disabled'}>Treinar meus erros</button></div>${errs.length?errs.map((e,i)=>`<div class="trackrow"><div class="number">${i+1}</div><div><b>${esc(e.question.stem)}</b><small>${esc(getSubject(e.question.subject).name)} · ${formatDay(e.date)}</small></div><button class="linkbtn" data-act="singleQuestion" data-qid="${e.qid}">Refazer ↗</button></div>`).join(''):'<div class="empty">Ainda não há questões erradas pendentes.<strong>Continue resolvendo exercícios.</strong>Quando errar, a questão aparecerá aqui automaticamente.</div>'}</div>`;}
function resourceFull(){return subjects.map(s=>`<div class="card pad"><div class="boxhead"><h3>${esc(s.name)}</h3><span class="badge ${s.group==='gerais'?'bgblue':'bggray'}">${s.group==='gerais'?'Geral':'Específica'}</span></div>${(resources[s.id]||[]).map(l=>`<a target="_blank" rel="noopener" href="${esc(l[1])}" class="resourcebox"><div class="ri">↗</div><div><b>${esc(l[0])}</b><small>Recurso externo</small></div><span class="arrow">↗</span></a>`).join('')}<button data-act="openSubject" data-sid="${s.id}" class="btn sm outline" style="margin-top:9px">Abrir trilha desta matéria ↗</button></div>`).join('')}
function renderLibrary(){$('#app').innerHTML=section('Materiais gratuitos selecionados.','Fontes oficiais, portais públicos e pesquisas direcionadas para complementar cada tópico.','BIBLIOTECA',`<span class="badge bggreen">Sem material pago obrigatório</span>`)+`<div class="note" style="margin-bottom:17px">Os links oficiais levam a textos legais e portais de referência. Para cada <strong>tópico</strong>, o painel também oferece buscas prontas de videoaulas e questões FCC. Confira atualizações normativas antes de estudar.</div><div class="courses" style="grid-template-columns:repeat(auto-fit,minmax(275px,1fr))">${resourceFull()}</div><div class="card pad" style="margin-top:18px"><h3>Links centrais do concurso</h3><div class="resourcebox"><div class="ri">▧</div><div><b>FCC — banca organizadora</b><small>Publicações, inscrição e retificações</small></div><a class="btn sm outline" href="https://www.concursosfcc.com.br/" target="_blank" rel="noopener">Visitar ↗</a></div><div class="resourcebox"><div class="ri">▧</div><div><b>TCE-GO — notícias e concursos</b><small>Canal oficial do órgão</small></div><a class="btn sm outline" href="https://portal.tce.go.gov.br/" target="_blank" rel="noopener">Visitar ↗</a></div><div class="resourcebox"><div class="ri">✎</div><div><b>Questões FCC de terceiros</b><small>Pesquisa direcionada em bancos de questões; cadastro ou pagamento podem ser exigidos.</small></div><a class="btn sm outline" href="${google('questões anteriores FCC técnico administrativo controle externo')}' target="_blank" rel="noopener">Pesquisar ↗</a></div></div>`;}
function quizStart(mode='practice',sid='all',listIds=null){const candidates=listIds?bank.filter(q=>listIds.includes(q.id)):(sid==='all'?bank:bank.filter(q=>q.subject===sid));quiz={active:true,mode,subject:sid,queue:mode==='exam'?bank.map(q=>q.id):(sid==='all'&&!listIds?[...candidates].sort(()=>Math.random()-.5).slice(0,10).map(q=>q.id):candidates.map(q=>q.id)),idx:0,answers:{},selected:null,done:false};if(!quiz.queue.length){notify('Nenhuma questão nesse filtro.');return}nav('quiz')}
function renderQuiz(){if(quiz.active){renderQuestion();return}let sfilter=quiz.subject||'all';$('#app').innerHTML=section('Resolver é aprender.','70 questões autorais com cinco alternativas, explicações e acompanhamento automático.','TREINO INTELIGENTE',`<span class="badge bgblue">${bank.length} questões no banco inicial</span>`)+`<div class="cols"><div><div class="card pad"><div class="boxhead"><h3>Iniciar treino objetivo</h3><span class="badge bgblue">Respostas comentadas</span></div><p class="hintline">Escolha uma matéria ou faça uma rodada com questões de todas. Seu desempenho fica registrado aqui.</p><label class="barlabel" for="quizSubject">MATÉRIA</label><select id="quizSubject" class="field" style="width:100%;margin:9px 0 17px"><option value="all">Treino misto — 10 questões aleatórias</option>${subjects.map(s=>`<option value="${s.id}" ${sfilter===s.id?'selected':''}>${esc(s.name)} (${bank.filter(q=>q.subject===s.id).length})</option>`).join('')}</select><div class="quickfill"><button class="btn primary" data-act="startPractice">▶ Começar questões</button><button class="btn outline" data-act="trainMistakes" ${missedQuestions().length?'':'disabled'}>↻ Refazer erros (${missedQuestions().length})</button></div></div><div class="card pad" style="margin-top:17px"><div class="boxhead"><h3>Como usar o treino</h3></div><div class="trackrow"><div class="number">01</div><div><b>Estude um tópico</b><small>Abra os links por assunto no edital.</small></div></div><div class="trackrow"><div class="number">02</div><div><b>Responda sem consultar</b><small>Leia a explicação somente depois de escolher.</small></div></div><div class="trackrow"><div class="number">03</div><div><b>Revisite os erros</b><small>Questões erradas aparecem no caderno automaticamente.</small></div></div></div></div><div><div class="card pad"><div class="boxhead"><h3>Simulado da prova</h3><span class="badge bgyellow">Modo avaliação</span></div><div style="font-size:42px;font-weight:850;color:#376ee6;letter-spacing:-2px">70 <span style="font-size:17px;color:#7893b5">questões</span></div><p class="hintline">25 gerais (peso 1) + 45 específicas (peso 2). Total ponderado máximo: 115 pontos. Sem mostrar gabarito até o fim. <b>Treino autoral</b>, não prova oficial.</p><p class="hintline">Reserve até 4h30 para simular também as condições da prova, incluindo a redação em treino separado.</p><button class="btn primary" data-act="startExam">◷ Fazer simulado completo</button></div><div class="card pad" style="margin-top:17px"><div class="boxhead"><h3>Meu desempenho por matéria</h3></div>${subjects.map(s=>`<div class="row" style="padding:9px 0;border-bottom:1px solid #eef2f7"><span style="font-size:11px;max-width:70%">${esc(s.name)}</span><b style="font-size:11px;color:#4c77bd">${attemptAccuracy(s.id)===null?'—':attemptAccuracy(s.id)+'%'}</b></div>`).join('')}</div></div></div>`;}
function recordAnswer(qid,sel){const q=bank.find(q=>q.id===qid);if(!q)return;state.attempts.push({qid,subject:q.subject,date:localDay(),timestamp:new Date().toISOString(),correct:sel===q.answer,selected:sel});save()}
function renderQuestion(){if(quiz.done){renderQuizResult();return}const q=bank.find(q=>q.id===quiz.queue[quiz.idx]);if(!q){quiz.active=false;renderQuiz();return}const isExam=quiz.mode==='exam',doneThis=Object.hasOwn(quiz.answers,q.id),value=quiz.answers[q.id];const answeredSoFar=Object.keys(quiz.answers).length;$('#app').innerHTML=`<button class="studyback" data-act="quitQuiz">← Voltar às questões</button>${section(isExam?'Simulado TCE-GO':'Treino de questões',isExam?'O gabarito fica oculto até finalizar o simulado.':'Responda e confira o comentário antes de avançar.','QUESTÕES · FCC / TREINO AUTORAL',`<span class="badge ${isExam?'bgyellow':'bgblue'}">${isExam?'Simulado':'Prática guiada'}</span>`)}<div class="card pad" style="max-width:870px;margin:auto"><div class="qtoolbar"><div class="qcount">QUESTÃO ${quiz.idx+1} DE ${quiz.queue.length}</div><span class="badge bggray">${esc(getSubject(q.subject).name)} · ${q.group==='gerais'?'Peso 1':'Peso 2'}</span></div><div class="quizbar"><div style="width:${pct(quiz.idx+1,quiz.queue.length)}%"></div></div><div class="qtitle">${esc(q.stem)}</div><div class="qoptions">${q.options.map((opt,i)=>{let klass='';if(doneThis){if(!isExam&&i===q.answer)klass='correct';else if(!isExam&&i===value&&value!==q.answer)klass='wrong';else if(i===value)klass='chosen'}return `<button class="qopt ${klass}" data-act="answer" data-qid="${q.id}" data-choice="${i}" ${doneThis?'disabled':''}><span class="letter">${'ABCDE'[i]}</span><span>${esc(opt)}</span></button>`}).join('')}</div>${doneThis&&!isExam?`<div class="explain ${value===q.answer?'':'bad'}"><strong>${value===q.answer?'✓ Você acertou!':'✕ Resposta incorreta.'}</strong><br/>Gabarito: <strong>${'ABCDE'[q.answer]}</strong>. ${esc(q.explanation)}</div>`:''}<div class="row" style="margin-top:20px"><span class="hintline">Respondidas: ${answeredSoFar}/${quiz.queue.length} ${isExam?'· sem consulta ao gabarito':''}</span><button class="btn primary" data-act="nextQuestion" ${doneThis?'':'disabled'}>${quiz.idx===quiz.queue.length-1?'Finalizar':'Próxima questão →'}</button></div></div>`;}
function answerQuestion(qid,choice){if(quiz.mode==='exam'&&Object.hasOwn(quiz.answers,qid))return;if(quiz.mode!=='exam'&&Object.hasOwn(quiz.answers,qid))return;const q=bank.find(q=>q.id===qid);if(!q)return;quiz.answers[qid]=Number(choice);if(quiz.mode!=='exam')recordAnswer(qid,Number(choice));renderQuestion()}
function quizNext(){if(!Object.hasOwn(quiz.answers,quiz.queue[quiz.idx]))return;if(quiz.idx<quiz.queue.length-1){quiz.idx++;renderQuestion()}else{quiz.done=true;if(quiz.mode==='exam'){let score=0,correct=0;for(const [id,v] of Object.entries(quiz.answers)){const q=bank.find(q=>q.id===id);if(q){recordAnswer(id,v);if(v===q.answer){correct++;score+=q.group==='gerais'?1:2}}}state.exams.push({date:localDay(),when:new Date().toISOString(),correct,score,outof:115,percent:pct(correct,quiz.queue.length)});save()}renderQuizResult()}}
function renderQuizResult(){const qids=quiz.queue,answered=qids.filter(id=>Object.hasOwn(quiz.answers,id)),hit=answered.filter(id=>{const q=bank.find(q=>q.id===id);return q&&q.answer===quiz.answers[id]}).length;const score=answered.reduce((a,id)=>{let q=bank.find(q=>q.id===id);return a+(q.answer===quiz.answers[id]?(q.group==='gerais'?1:2):0)},0);let maxPoints=answered.reduce((a,id)=>a+(bank.find(q=>q.id===id).group==='gerais'?1:2),0);$('#app').innerHTML=section('Bloco concluído!','Use o resultado para escolher seus próximos ciclos de estudo.','DESEMPENHO',`<span class="badge bggreen">✓ Finalizado</span>`)+`<div class="card summaryblock" style="max-width:660px;margin:auto"><div class="eyebrow">${quiz.mode==='exam'?'RESULTADO DO SIMULADO':'RESULTADO DO TREINO'}</div><strong>${pct(hit,answered.length)}%</strong><h3>${hit} de ${answered.length} acertos</h3><p class="muted">${quiz.mode==='exam'?`Pontuação ponderada: <b>${score} de ${maxPoints} pontos</b>. A nota oficial usa regras próprias de padronização; isto é apenas um indicador pedagógico.`:'Cada questão respondida foi registrada no seu histórico.'}</p><div class="quickfill" style="justify-content:center;margin-top:24px"><button data-act="quitQuiz" class="btn primary">Voltar aos treinos</button><button data-view="mistakes" class="btn outline">Revisar meus erros</button></div></div>`;}
function renderHistory(){const total=totals();let days=[];for(let i=13;i>=0;i--){let d=addDays(localDay(),-i),as=state.attempts.filter(a=>a.date===d),ms=state.sessions.filter(x=>x.date===d).reduce((s,x)=>s+Number(x.minutes||0),0);days.push({date:d,count:as.length,accuracy:accuracy(as),mins:ms})};const all=state.exams.slice().reverse();$('#app').innerHTML=section('O que você já construiu.','Visualize sua constância, acertos e horas dedicadas.','HISTÓRICO',`<span class="badge bgblue">${total.questions} questões feitas</span>`)+`<div class="grid4">${stat('ACERTO GERAL',total.questions?total.rate+'%':'—','Questões autorais','◎')}${stat('TOTAL DE QUESTÕES',total.questions,'Respostas registradas','✎')}${stat('TEMPO ESTUDADO',(total.mins/60).toFixed(1)+'h',total.mins+' minutos','◷')}${stat('SIMULADOS FEITOS',state.exams.length,'Treinos de 70 questões','▤')}</div><div class="cols"><div><div class="card pad"><div class="boxhead"><h3>Últimos 14 dias</h3></div><table class="history"><thead><tr><th>Dia</th><th>Questões</th><th>Acertos</th><th>Tempo</th></tr></thead><tbody>${days.map(d=>`<tr><td>${formatDay(d.date)}</td><td>${d.count}</td><td>${d.count?d.accuracy+'%':'—'}</td><td>${d.mins} min</td></tr>`).join('')}</tbody></table></div><div class="card pad" style="margin-top:18px"><div class="boxhead"><h3>Seus simulados</h3></div>${all.length?all.map(e=>`<div class="trackrow"><div class="number">✓</div><div><b>${formatDay(e.date)} · ${e.correct}/70 acertos</b><small>${e.score}/115 pontos de treino</small></div><span class="badge bgblue">${e.percent}%</span></div>`).join(''):'<p class="hintline">Ainda não há simulados completos.</p>'}</div></div><div><div class="card pad"><div class="boxhead"><h3>Meta diária</h3></div><label class="barlabel" for="goal">QUANTAS QUESTÕES POR DIA?</label><input class="field" id="goal" type="number" min="1" max="500" value="${esc(state.dailyGoal||30)}" style="width:100%;margin:9px 0 15px"><button class="btn primary" data-act="saveGoal">Salvar meta</button><p class="hintline">Sugestão: 20–40 questões por dia na fase inicial, elevando conforme o domínio e o tempo disponível.</p></div><div class="card pad" style="margin-top:18px"><div class="boxhead"><h3>Registrar estudo</h3></div><p class="hintline">Use quando estudar por vídeo, livro ou PDF fora do site.</p><div class="toggleline"><input class="field" type="number" min="1" max="480" value="25" id="minutes" style="width:90px"><span class="hintline">minutos</span><button class="btn primary sm" data-act="logStudy">Registrar</button></div><hr style="border:0;border-top:1px solid #eef2f7;margin:23px 0"><h3 style="font-size:13px">Pomodoro (25 min)</h3><div class="timebox" id="timerText">${timeString(timer.remaining)}</div><div class="quickfill"><button class="btn outline sm" data-act="toggleTimer">${timer.running?'Pausar':'Iniciar'}</button><button class="btn outline sm" data-act="resetTimer">Reiniciar</button></div></div></div></div>`;}
function timeString(seconds){return `${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`}
function timerTick(){timer.remaining--;let el=$('#timerText');if(el)el.textContent=timeString(timer.remaining);if(timer.remaining<=0){clearInterval(timer.interval);timer.running=false;timer.remaining=1500;state.sessions.push({date:localDay(),minutes:25});save();notify('Pomodoro concluído! 25 minutos registrados.');if(currentView==='history')renderHistory()}}
function renderSettings(){$('#app').innerHTML=section('Seus dados, sob seu controle.','Salve uma cópia de segurança e transfira seu progresso quando precisar.','CONFIGURAÇÕES')+`<div class="cols"><div><div class="card pad"><h3>💾 Backup do seu progresso</h3><p class="hintline">O painel usa armazenamento local do navegador. Seus dados persistem ao recarregar e atualizar os arquivos no mesmo endereço, <b>mas não sincronizam automaticamente</b> com outros aparelhos ou navegadores.</p><div class="quickfill" style="margin-top:19px"><button class="btn primary" data-act="export">↓ Baixar backup JSON</button><label class="btn outline" for="importFile" style="cursor:pointer">↑ Importar backup</label><input id="importFile" type="file" accept=".json,application/json" style="display:none"/></div><div class="note" style="margin-top:18px"><strong>Dica:</strong> faça backup semanal. Para sincronização automática entre PC e celular seria necessário conectar uma conta e banco de dados em uma próxima versão.</div></div><div class="card pad" style="margin-top:17px"><h3>Sobre esta versão</h3><p class="hintline"><strong>Central TCE-GO • v1.0</strong><br/>14 matérias e 217 tópicos principais organizados por disciplina; 70 questões de treino autorais, com 25 gerais e 45 específicas. Edital nº 01/2026 e retificação de setembro de 2026, Técnico Administrativo (A01).</p><p class="hintline"><b>Atenção:</b> materiais e questões são recursos educacionais independentes. O programa deve ser cotejado com o edital oficial retificado. A seção de redação, a sincronização em nuvem e novos bancos de questões podem ser incorporados em atualizações futuras.</p></div></div><div><div class="card pad"><h3>Links oficiais</h3><a target="_blank" rel="noopener" class="resourcebox" href="https://www.concursosfcc.com.br/"><div class="ri">↗</div><div><b>FCC — Banca</b><small>Inscrição e publicações</small></div></a><a target="_blank" rel="noopener" class="resourcebox" href="https://portal.tce.go.gov.br/"><div class="ri">↗</div><div><b>Tribunal de Contas de GO</b><small>Portal institucional</small></div></a></div><div class="card pad" style="margin-top:17px;border-color:#f3dedf"><h3 style="color:#aa4d55">Apagar progresso</h3><p class="hintline">Exclui apenas os dados salvos neste navegador. Recomendamos exportar backup antes.</p><button class="btn sm" data-act="wipe" style="background:#ffeaea;color:#bf4a55">Excluir todos os meus dados</button></div></div></div>`;}
function download(name,content,mime){let blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function importBackup(file){if(!file)return;file.text().then(t=>{const data=JSON.parse(t);if(!data||typeof data!=='object'||!Array.isArray(data.attempts)||!data.topicStatus||!Array.isArray(data.sessions))throw Error('Formato inválido');if(!confirm('Substituir o progresso atual pelos dados deste backup?'))return;state={...base,...data};save();notify('Backup importado com sucesso');nav('home')}).catch(()=>notify('Não foi possível importar o arquivo. Use um backup gerado pelo painel.'))}
function stopTimer(){if(timer.interval)clearInterval(timer.interval);timer.interval=null;timer.running=false;}
function startExam(){if(!confirm('Iniciar simulado autoral de 70 questões? O gabarito aparecerá somente no final.'))return;quizStart('exam','all')}
function globalClick(event){const clicked=event.target.closest('a,button,label');if(!clicked&&!event.target.closest('.modalwrap[data-act=closeModal]'))return;if(clicked&&clicked.matches('[data-view]')){window.editalExpanded=false;nav(clicked.dataset.view);return}const el=event.target.closest('[data-act]');if(!el)return;const act=el.dataset.act,id=el.dataset.tid,sid=el.dataset.sid;
 if(act==='openSuggested'){const item=suggestedTopics()[0];if(item)openDetail(item.id);else nav('review')}
 else if(act==='filter'){topicFilter=el.dataset.filter;window.editalExpanded=false;renderSyllabus()}
 else if(act==='openSubject'){selectedSubject=sid;window.editalExpanded=true;nav('syllabus',sid)}
 else if(act==='backSubjects'){window.editalExpanded=false;nav('syllabus')}
 else if(act==='cycleStatus')updateStatus(id)
 else if(act==='detail')openDetail(id)
 else if(act==='closeModal'){if(event.target===el||el.classList.contains('close'))$('#overlay').innerHTML=''}
 else if(act==='quickQuiz'){quizStart('practice',sid);$('#overlay').innerHTML=''}
 else if(act==='reviewDone')completeReview(id)
 else if(act==='exportEssay'){const e=essays.find(x=>x.id===essaySelected)||essays[0];download('redacao-'+essaySelected+'.txt','Tema: '+e.topic+'\n\n'+((state.essayDrafts||{})[essaySelected]||''),'text/plain')}
 else if(act==='copyEssay'){const e=essays.find(x=>x.id===essaySelected)||essays[0],txt=(state.essayDrafts||{})[essaySelected]||'';if(!txt.trim()){notify('Escreva sua redação antes de copiar.');return}const value='Corrija esta redação de treino para o TCE-GO 2027 (Técnico Administrativo), quanto à gramática, coesão, tese, argumentos e conclusão. Dê sugestões específicas, sem fingir nota oficial da FCC. Tema: '+e.topic+'\n\n'+txt;navigator.clipboard?.writeText(value).then(()=>notify('Texto copiado! Cole em uma conversa comigo.')).catch(()=>notify('Não foi possível copiar. Selecione o texto e copie manualmente.'))}
 else if(act==='startPractice'){quizStart('practice',$('#quizSubject')?.value||'all')}
 else if(act==='trainMistakes'){quizStart('practice','all',missedQuestions().map(e=>e.qid))}
 else if(act==='singleQuestion'){quizStart('practice','all',[el.dataset.qid])}
 else if(act==='startExam')startExam()
 else if(act==='answer')answerQuestion(el.dataset.qid,el.dataset.choice)
 else if(act==='nextQuestion')quizNext()
 else if(act==='quitQuiz'){quiz.active=false;quiz.done=false;nav('quiz')}
 else if(act==='saveGoal'){const n=Math.max(1,Math.min(500,Number($('#goal')?.value)||30));state.dailyGoal=n;save();notify('Meta diária salva: '+n+' questões.');renderHistory()}
 else if(act==='logStudy'){const m=Math.max(1,Math.min(480,Number($('#minutes')?.value)||25));state.sessions.push({date:localDay(),minutes:m});save();notify(m+' minutos registrados.');renderHistory()}
 else if(act==='toggleTimer'){if(timer.running){stopTimer()}else{timer.interval=setInterval(timerTick,1000);timer.running=true}renderHistory()}
 else if(act==='resetTimer'){stopTimer();timer.remaining=1500;renderHistory()}
 else if(act==='export'){download('backup-tcego-matheus-'+localDay()+'.json',JSON.stringify(state,null,2),'application/json')}
 else if(act==='wipe'){if(confirm('Apagar permanentemente TODO o histórico salvo neste navegador?')){state=JSON.parse(JSON.stringify(base));save();quiz.active=false;notify('Progresso local reiniciado.');nav('home')}}
}
document.addEventListener('click',globalClick);document.addEventListener('input',e=>{if(e.target.id==='essayEditor'){state.essayDrafts=state.essayDrafts||{};state.essayDrafts[essaySelected]=e.target.value;save();const c=$('#essayWords');if(c)c.textContent=words(e.target.value)+' palavras · salvo automaticamente neste navegador'}if(e.target.id==='subjectSearch'){searchTerm=e.target.value;let pos=e.target.selectionStart;renderSyllabus();$('#subjectSearch')?.focus();try{$('#subjectSearch')?.setSelectionRange(pos,pos)}catch(_){}}});document.addEventListener('change',e=>{if(e.target.id==='importFile')importBackup(e.target.files?.[0]);if(e.target.id==='essayTheme'){essaySelected=e.target.value;renderEssay()}if(e.target.id==='quizSubject')quiz.subject=e.target.value});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#overlay').innerHTML=''});
window.editalExpanded=false;todayHeader();nav('home');
})();
</script>
</body></html>
